<!DOCTYPE html>
<html>
<head><style>
  body { background: #0f1117; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; padding: 40px; font-family: system-ui; }
  .card { text-align: center; }
  .label { color: #818cf8; font-size: 13px; margin-top: 8px; }
  .orb-wrap { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .glow { position: absolute; width: 160px; height: 160px; border-radius: 50%; filter: blur(12px); }
  .sphere { width: 96px; height: 96px; border-radius: 50%; position: relative; overflow: hidden; }
  .spec { position: absolute; top: 8%; left: 15%; width: 35%; height: 20%; background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent); border-radius: 50%; filter: blur(4px); }
  .normal { background: radial-gradient(circle at 40% 35%, #fef9c3 0%, #fde68a 15%, #fbbf24 35%, #f59e0b 55%, #d97706 80%, #92400e 100%); box-shadow: 0 0 30px #f59e0b55, 0 0 60px #fbbf2422, inset 0 -10px 20px #92400eaa; }
  .normal .glow { background: radial-gradient(circle, #f59e0b44 0%, transparent 70%); }
  .confused-sphere { background: radial-gradient(circle at 40% 35%, #fde68a 0%, #fbbf24 25%, #f59e0b 50%, #d97706 75%, #92400e 100%); box-shadow: 0 0 30px #f59e0b66, inset 0 -10px 20px #78350faa; }
  .confused-sphere .glow { background: radial-gradient(circle, #f59e0b44 0%, transparent 70%); }
</style></head>
<body>

<!-- IDLE -->
<div class="card">
  <div class="orb-wrap">
    <div class="glow" style="background: radial-gradient(circle, #818cf844, transparent 70%)"></div>
    <div class="sphere normal">
      <div class="spec"></div>
      <svg width="96" height="96" viewBox="0 0 88 88" style="position:absolute;inset:0;width:100%;height:100%">
        <!-- Eyes -->
        <ellipse cx="24.6" cy="42.2" rx="14.96" ry="17.6" fill="white"/>
        <circle cx="24.6" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="21.8" cy="39.1" r="1.85" fill="white"/>
        <ellipse cx="63.4" cy="42.2" rx="14.96" ry="17.6" fill="white"/>
        <circle cx="63.4" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="60.6" cy="39.1" r="1.85" fill="white"/>
        <!-- Brows -->
        <line x1="12.3" y1="21" x2="36.9" y2="21" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <line x1="51.1" y1="21" x2="75.7" y2="21" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <!-- Mouth: smile -->
        <path d="M 35.2 63.4 Q 44 70.4 52.8 63.4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div class="label">idle</div>
</div>

<!-- LISTENING -->
<div class="card">
  <div class="orb-wrap">
    <div class="glow" style="background: radial-gradient(circle, #818cf866, transparent 70%)"></div>
    <div class="sphere normal">
      <div class="spec"></div>
      <svg width="96" height="96" viewBox="0 0 88 88" style="position:absolute;inset:0;width:100%;height:100%">
        <ellipse cx="24.6" cy="42.2" rx="16.5" ry="20.2" fill="white"/>
        <circle cx="24.6" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="21.8" cy="39.1" r="1.85" fill="white"/>
        <ellipse cx="63.4" cy="42.2" rx="16.5" ry="20.2" fill="white"/>
        <circle cx="63.4" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="60.6" cy="39.1" r="1.85" fill="white"/>
        <line x1="12.3" y1="18" x2="36.9" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <line x1="51.1" y1="19" x2="75.7" y2="18" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <!-- Mouth: o -->
        <ellipse cx="44" cy="65.4" rx="4.4" ry="4.84" fill="white" opacity="0.85"/>
      </svg>
    </div>
  </div>
  <div class="label">listening</div>
</div>

<!-- NEXT -->
<div class="card">
  <div class="orb-wrap">
    <div class="glow" style="background: radial-gradient(circle, #818cf844, transparent 70%)"></div>
    <div class="sphere normal">
      <div class="spec"></div>
      <svg width="96" height="96" viewBox="0 0 88 88" style="position:absolute;inset:0;width:100%;height:100%">
        <ellipse cx="24.6" cy="42.2" rx="14.96" ry="17.6" fill="white"/>
        <circle cx="28.6" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="25.8" cy="39.1" r="1.85" fill="white"/>
        <ellipse cx="63.4" cy="42.2" rx="14.2" ry="15.8" fill="white"/>
        <circle cx="67.4" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="64.6" cy="39.1" r="1.85" fill="white"/>
        <!-- Raised left brow, flat right -->
        <line x1="12.3" y1="23" x2="36.9" y2="17" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <line x1="51.1" y1="23" x2="75.7" y2="21" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <!-- Smirk -->
        <path d="M 37 65.4 Q 47.8 69.7 52.8 62.4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div class="label">next slide</div>
</div>

<!-- CONFUSED -->
<div class="card">
  <div class="orb-wrap">
    <div class="glow" style="background: radial-gradient(circle, #f59e0b44, transparent 70%)"></div>
    <div class="sphere confused-sphere">
      <div class="spec"></div>
      <svg width="96" height="96" viewBox="0 0 88 88" style="position:absolute;inset:0;width:100%;height:100%">
        <ellipse cx="24.6" cy="42.2" rx="14.96" ry="17.6" fill="white"/>
        <circle cx="27.6" cy="41.2" r="6.16" fill="#0f172a"/>
        <circle cx="24.8" cy="38.1" r="1.85" fill="white"/>
        <ellipse cx="63.4" cy="42.2" rx="12.7" ry="14" fill="white"/>
        <circle cx="66.4" cy="41.2" r="6.16" fill="#0f172a"/>
        <circle cx="63.6" cy="38.1" r="1.85" fill="white"/>
        <!-- Asymmetric brows -->
        <line x1="12.3" y1="24" x2="36.9" y2="16" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <line x1="51.1" y1="18" x2="75.7" y2="24" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <!-- Flat mouth -->
        <line x1="37" y1="65.4" x2="51" y2="65.4" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <!-- ? -->
        <text x="78" y="26" font-size="19" fill="#fbbf24" font-weight="bold" text-anchor="middle">?</text>
      </svg>
    </div>
  </div>
  <div class="label">confused</div>
</div>

<!-- SLEEPING -->
<div class="card">
  <div class="orb-wrap">
    <div class="glow" style="background: radial-gradient(circle, #818cf822, transparent 70%)"></div>
    <div class="sphere normal" style="opacity: 0.85; box-shadow: 0 0 15px #6366f122, inset 0 -10px 20px #1e1b4baa;">
      <div class="spec" style="opacity: 0.3"></div>
      <svg width="96" height="96" viewBox="0 0 88 88" style="position:absolute;inset:0;width:100%;height:100%">
        <!-- Closed eyes: curved lines -->
        <path d="M 9.6 42.2 Q 24.6 48.2 39.6 42.2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 48.4 42.2 Q 63.4 48.2 78.4 42.2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Small o mouth -->
        <ellipse cx="44" cy="65.4" rx="4.4" ry="4.84" fill="white" opacity="0.85"/>
      </svg>
    </div>
  </div>
  <div class="label">sleeping</div>
</div>

<!-- GREETING -->
<div class="card">
  <div class="orb-wrap">
    <div class="glow" style="background: radial-gradient(circle, #818cf866, transparent 70%)"></div>
    <div class="sphere normal">
      <div class="spec"></div>
      <svg width="96" height="96" viewBox="0 0 88 88" style="position:absolute;inset:0;width:100%;height:100%">
        <ellipse cx="24.6" cy="42.2" rx="17.2" ry="21.1" fill="white"/>
        <circle cx="24.6" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="21.8" cy="39.1" r="1.85" fill="white"/>
        <ellipse cx="63.4" cy="42.2" rx="17.2" ry="21.1" fill="white"/>
        <circle cx="63.4" cy="42.2" r="6.16" fill="#0f172a"/>
        <circle cx="60.6" cy="39.1" r="1.85" fill="white"/>
        <line x1="12.3" y1="16" x2="36.9" y2="17" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <line x1="51.1" y1="17" x2="75.7" y2="16" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <!-- Wide smile -->
        <path d="M 33.4 63.4 Q 44 73.9 54.6 63.4" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div class="label">greeting</div>
</div>

</body>
</html>
